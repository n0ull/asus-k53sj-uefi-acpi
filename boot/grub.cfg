set timeout=10
set default=0
terminal_output console
menuentry 'K53SJ AcpiFirst - find Windows installer and start it (UEFI)' {
    echo 'Starting AcpiFirst directly; no EFI Shell is needed.'
    chainloader /AcpiFirst.efi
    boot
    echo 'AcpiFirst returned. Photograph the messages above.'
    sleep --interruptible 600
}
